<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOB SafePay AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 480px;
        }
        h1 { color: #38bdf8; }
        p { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>BOB SafePay AI</h1>
        <p>Fraud Detection & Safe Banking Assistant</p>
        <p id="status">Connecting to server...</p>
    </div>

    <script>
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = 'Backend Status: ' + data.status;
                document.getElementById('status').style.color = '#4ade80';
            })
            .catch(() => {
                document.getElementById('status').innerText = 'Backend Offline';
                document.getElementById('status').style.color = '#f87171';
            });
    </script>
</body>
</html>
